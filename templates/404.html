{% extends 'base.html' %}
{% block title %}404 — {{ message }}{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold" style="background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent;">404</div>
    <h2 class="mb-3">{{ message }}</h2>
    <p class="text-muted">Проверьте адрес или вернитесь на главную страницу.</p>
    <a href="{% url 'homepage:index' %}" class="btn btn-primary btn-lg mt-3">На главную</a>
</div>
{% endblock %}
