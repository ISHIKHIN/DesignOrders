{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DesignOrders{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    {% include 'includes/navigation.html' %}
    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>
    <footer class="container mt-4 mb-3">
        <p>© <span id="current-year"></span> DesignOrders</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
