<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DesignOrders{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'homepage:index' %}">DesignOrders</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'clients:list' %}">Клиенты</a>
                <a class="nav-link" href="{% url 'designers:list' %}">Дизайнеры</a>
                <a class="nav-link" href="{% url 'orders:list' %}">Заказы</a>
                <a class="nav-link" href="{% url 'stages:list' %}">Этапы</a>
            </div>
        </div>
    </nav>
    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
